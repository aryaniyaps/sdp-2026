name: Deploy to Azure

# Rebuilds the image on the Azure VM and swaps the engine and term containers when the service
# source changes on main. Setup: deploy/azure/README.md.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - migrations/**
      - integrations/pi/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deploy/azure/**
      - .github/workflows/deploy-azure.yml
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: deploy/azure/deploy.sh
        env:
          AZURE_RG: sdp-memory-rg
          AZURE_VM: sdp-memory-vm
