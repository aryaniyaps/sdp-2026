<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi with shared memory</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#a88bff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .hint { color: var(--dim); flex: 1 1 360px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button, a.btn { font: inherit; color: var(--text); background: #21262d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button.active { border-color: var(--accent); background: #2a2150; }
  main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  .pane { min-height: 0; min-width: 0; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; }
  .pane:last-child { border-right: 0; }
  .pane h2 { font-size: 12px; font-weight: 600; color: var(--dim); margin: 0; padding: 6px 12px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .pane { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Pi with shared memory</h1>
  <div class="hint">Tell Pi a few facts in one session. Open a session in the other directory and ask about them. The graph on the right fills in as the memory service extracts facts.</div>
  <div class="buttons">
    <button id="b-payments-api" class="active">Session in payments-api</button>
    <button id="b-mobile-app">Session in mobile-app</button>
    <a class="btn" href="__VIDEO_URL__" target="_blank" rel="noopener">Watch the recording</a>
  </div>
</header>
<main>
  <section class="pane"><h2 id="term-title">Pi, session in payments-api</h2><iframe id="term" title="Pi terminal" allow="clipboard-write" src="/term/?arg=payments-api"></iframe></section>
  <section class="pane"><h2>Memory graph for user:dev, read live</h2><iframe id="graph" title="Memory graph" src="/graph?namespace=user%3Adev"></iframe></section>
</main>
<script>
  const term = document.getElementById('term'), title = document.getElementById('term-title');
  function open(dir) {
    term.src = '/term/?arg=' + encodeURIComponent(dir) + '&t=' + Date.now();
    title.textContent = 'Pi, session in ' + dir;
    for (const d of ['payments-api', 'mobile-app']) document.getElementById('b-' + d).classList.toggle('active', d === dir);
  }
  for (const d of ['payments-api', 'mobile-app']) document.getElementById('b-' + d).addEventListener('click', () => open(d));
</script>
</body>
</html>
