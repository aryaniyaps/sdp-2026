services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - memory_pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '[]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    profiles: ["full"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://memory:memory@127.0.0.1:55432/memory
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      OLLAMA_URL: http://127.0.0.1:11434
      EXTRACTION_MODEL: qwen2.5:14b-instruct-q4_K_M
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      DEMO_MODE: "true"
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
volumes:
  memory_pgdata:
  neo4j_data:
  neo4j_logs:
