services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
  api:
    build: .
    profiles: ["full"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://memory:memory@127.0.0.1:55432/memory
      OLLAMA_URL: http://127.0.0.1:11434
      EXTRACTION_MODEL: qwen2.5:14b-instruct-q4_K_M
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  memory_pgdata:

