<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Review 1 · Memory Engine</title><style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#121823;--line:#263244;--text:#eef4ff;--muted:#91a0b8;--accent:#76e6b5;--warn:#ffc875}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18253a 0,var(--bg) 35%);font:15px/1.5 system-ui;color:var(--text)}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:26px;margin:0}h2{font-size:16px;margin:0 0 13px}.tag,.badge{border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 14px 40px #0004}.wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}input,textarea{width:100%;background:#090d14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}textarea{min-height:92px;resize:vertical}.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row>*{flex:1}button{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:#062317;font-weight:700;cursor:pointer}button.secondary{background:#273348;color:var(--text)}button.danger{background:#4a2930;color:#ffdce1}.output{white-space:pre-wrap;background:#080c12;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:54px;color:#cbd6e8;overflow:auto}.memory{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:#0c111a}.superseded{border-color:var(--warn);opacity:.76}.meta{font-size:12px;color:var(--muted)}.badges{display:flex;gap:6px;margin-top:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{flex-wrap:wrap}.row>*{min-width:45%}}</style></head>
<body><main><header><div><h1>Memory Engine</h1><div class="meta">Review 1 · evidence-preserving temporal memory</div></div><span id="health" class="tag">checking models…</span></header><div class="grid">
<section class="panel"><h2>Ingest interaction</h2><label>Namespace</label><input id="ns" value="review"><label>Session</label><input id="sid" value="review-session"><label>Interaction text</label><textarea id="text">Aryan prefers Python for programming.</textarea><div class="row"><button onclick="ingest(false)">Live extraction</button><button class="secondary" onclick="ingest(true)">Deterministic fixture</button></div><div class="row"><button class="secondary" onclick="correction()">Load Rust correction</button><button class="danger" onclick="resetDemo()">Reset</button></div><label>Processing result</label><div id="ingestOut" class="output">Ready.</div></section>
<section class="panel"><h2>Hybrid recall</h2><label>Question</label><input id="query" value="What language does Aryan like to code in?"><div class="row"><input id="tokens" type="number" value="128" title="Max tokens"><button onclick="search()">Search active memory</button></div><label>Fused ranks</label><div id="ranks" class="output">No search yet.</div><label>Token-bounded context</label><div id="context" class="output">—</div></section>
<section class="panel wide"><div class="row"><h2>Memory ledger and provenance</h2><button class="secondary" onclick="loadMemories()">Refresh history</button></div><div id="memories">No memories yet.</div></section></div></main><script>
const $=id=>document.getElementById(id);let sessionId=null;async function json(url,opts={}){const r=await fetch(url,{headers:{'content-type':'application/json'},...opts});const body=await r.json();if(!r.ok)throw Error(body.error||r.statusText);return body}async function session(){const d=await json('/api/v1/sessions',{method:'POST',body:JSON.stringify({namespace:$('ns').value,external_id:$('sid').value})});sessionId=d.id;return d.id}async function ingest(fixture){try{const id=await session();const d=await json('/api/v1/events',{method:'POST',body:JSON.stringify({session_id:id,role:'user',content:$('text').value,deterministic_fixture:fixture})});$('ingestOut').textContent=`${d.outcomes.map(x=>`${x.action} v${x.version}`).join(', ')||'No durable facts'} · ${d.elapsed_ms} ms${d.degraded_mode?' · embeddings degraded':''}`;await loadMemories()}catch(e){$('ingestOut').textContent=e.message}}function correction(){$('text').value='Aryan now prefers Rust for programming.'}async function search(){try{const d=await json('/api/v1/search',{method:'POST',body:JSON.stringify({namespace:$('ns').value,query:$('query').value,top_k:5,max_tokens:+$('tokens').value})});$('ranks').innerHTML=d.results.map(x=>`<div>${esc(x.statement)}<div class="badges"><span class="badge">lex ${x.lexical_rank??'—'}</span><span class="badge">sem ${x.semantic_rank??'—'}</span><span class="badge">RRF ${x.fused_score.toFixed(5)}</span></div></div>`).join('')||'No matches';$('context').textContent=`${d.context||'(empty)'}\n${d.estimated_tokens} estimated tokens · ${d.elapsed_ms} ms${d.degraded_mode?' · lexical degraded mode':''}`}catch(e){$('ranks').textContent=e.message}}async function loadMemories(){try{const d=await json(`/api/v1/memories?namespace=${encodeURIComponent($('ns').value)}&include_history=true`);$('memories').innerHTML=d.map(x=>`<div class="memory ${x.status}"><b>${esc(x.statement)}</b> <span class="badge">v${x.version} ${x.status}</span><div class="meta">${esc(x.canonical_key)} · valid ${x.valid_from}${x.valid_to?' → '+x.valid_to:' → present'} · extractor ${esc(x.extractor_version)}${x.supersedes?' · supersedes '+x.supersedes:''}</div>${x.sources.map(s=>`<div class="meta">“${esc(s.quote)}” — ${esc(s.external_session_id)}, ${s.occurred_at}</div>`).join('')}</div>`).join('')||'No memories yet.'}catch(e){$('memories').textContent=e.message}}async function resetDemo(){await json('/api/v1/demo/reset',{method:'POST'});sessionId=null;$('ingestOut').textContent='Database reset.';await loadMemories()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function health(){try{const h=await json('/healthz');$('health').textContent=`DB ${h.database?'ready':'down'} · extraction ${h.extractor?'ready':'down'} · embedding ${h.embedder?'ready':'down'}${h.degraded_mode?' · degraded':''}`}catch(e){$('health').textContent='service unavailable'}}health();loadMemories();
</script></body></html>
