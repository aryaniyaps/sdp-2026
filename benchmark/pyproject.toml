[project]
name = "sdp-memory-benchmark"
version = "1.0.0"
description = "Notebook environment for the memory benchmark. The runner itself (run.py, properties.py) needs only the standard library."
requires-python = "==3.12.*"
dependencies = [
    "jupyterlab==4.6.4",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
]

[tool.uv]
package = false
